name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, feature/primeira-action]
  pull_request:
    branches: [main]

jobs:
  debug-structure:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Show project structure
      run: |
        echo "=== Current directory ==="
        pwd
        echo ""
        echo "=== All files in repository ==="
        ls -la
        echo ""
        echo "=== Looking for pom.xml ==="
        find . -name "pom.xml" -type f
        echo ""
        echo "=== Looking for src folder ==="
        find . -name "src" -type d