name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, feature/primeira-action]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Build with Maven
      run: mvn clean install
      # SEM working-directory (porque está na raiz)
    
    - name: Run Tests
      run: mvn test
      # SEM working-directory
    
    - name: Build Docker Image
      run: docker build -t esg-lixozen:latest .

  deploy-staging:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to Staging
      run: |
        echo "✅ Build concluído com sucesso!"
        echo "📦 Imagem Docker criada: esg-lixozen:latest"
        echo "🚀 Deploy para Staging executado!"

  deploy-production:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to Production
      run: |
        echo "✅ Build concluído com sucesso!"
        echo "📦 Imagem Docker criada: esg-lixozen:latest"
        echo "🚀 Deploy para Produção executado!"